<head>
<meta charset="utf-8">

<title>Отчёт Schedbook</title>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  img, svg, video { max-width: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
</style>

<body>
<style>
  :root {
    color-scheme: light;
    --ground:      #ffffff;
    --surface:     #ffffff;
    --lime:        #a4d537;
    --lime-soft:   #eaf6ce;
    --indigo:      #3b2fc9;
    --indigo-soft: #ededfa;
    --ink:         #1a1a1c;
    --ink-2:       #63636b;
    --ink-3:       #9a9aa2;
    --rule:        #e6e6ec;
    --chip:        #f2f2f6;
    --footer:      #1e1e21;
    --on-lime:     #1a1a1c;

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground:      #121214;
      --surface:     #1c1c20;
      --lime:        #b6e34f;
      --lime-soft:   #1f2a10;
      --indigo:      #8577f5;
      --indigo-soft: #1e1b33;
      --ink:         #f2f2f4;
      --ink-2:       #a3a3ac;
      --ink-3:       #75757e;
      --rule:        #2c2c32;
      --chip:        #26262c;
      --footer:      #0c0c0e;
      --on-lime:     #12140a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:      #121214;
    --surface:     #1c1c20;
    --lime:        #b6e34f;
    --lime-soft:   #1f2a10;
    --indigo:      #8577f5;
    --indigo-soft: #1e1b33;
    --ink:         #f2f2f4;
    --ink-2:       #a3a3ac;
    --ink-3:       #75757e;
    --rule:        #2c2c32;
    --chip:        #26262c;
    --footer:      #0c0c0e;
    --on-lime:     #12140a;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  /* ---------- шапка ---------- */
  .head {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px; background: var(--ground);
    border-bottom: 1px solid var(--rule);
  }
  .logo { display: inline-flex; align-items: baseline; font-weight: 700; font-size: 20px; letter-spacing: -.02em; color: var(--ink); }
  .logo i { font-style: normal; color: var(--lime); font-size: 27px; line-height: 0; margin-right: 1px; }
  .head .tag { font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--chip); border-radius: 999px; padding: 5px 11px; }

  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; margin: 24px 0 0; text-wrap: balance; }
  .period { margin: 8px 0 0; color: var(--ink-2); font-size: 15px; }

  h2 { font-size: 19px; font-weight: 700; letter-spacing: -.02em; margin: 32px 0 4px; }
  .sub { color: var(--ink-2); font-size: 14px; margin: 0 0 14px; }

  /* ---------- выбор ---------- */
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .pill {
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--chip); color: var(--ink); border: 0;
    border-radius: 999px; padding: 11px 15px; min-height: 44px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .pill .t { font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .pill[aria-pressed="true"] { background: var(--lime); color: var(--on-lime); }
  .pill[aria-pressed="true"] .t { color: var(--on-lime); opacity: .7; }
  .pill:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }

  /* ---------- кольца ---------- */
  .rings { display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch; }
  .ring-card {
    flex: 1 1 100%; background: var(--lime-soft); border-radius: 20px; padding: 18px;
    display: flex; align-items: center; gap: 18px;
  }
  .ring-card svg { flex: none; }
  .ring-legend { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .leg { display: flex; align-items: baseline; gap: 8px; font-size: 14px; }
  .leg b { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; align-self: center; }
  .dot-plan { background: var(--indigo); }
  .dot-fact { background: var(--lime); }
  .ring-note { font-size: 13px; color: var(--ink-2); margin: 2px 0 0; }

  .ring-center { font-weight: 700; font-variant-numeric: tabular-nums; fill: var(--ink); }
  .ring-track { stroke: var(--rule); fill: none; }
  .ring-plan { stroke: var(--indigo); fill: none; stroke-linecap: round; }
  .ring-fact { stroke: var(--lime); fill: none; stroke-linecap: round; }

  .week-rings { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
  .wr {
    background: var(--indigo-soft); border-radius: 16px; padding: 12px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    border: 0; font: inherit; color: inherit; cursor: pointer; min-height: 44px;
  }
  .wr[aria-pressed="true"] { outline: 2px solid var(--indigo); }
  .wr:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
  .wr .wr-name { font-size: 13px; font-weight: 600; }
  .wr .wr-time { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  /* ---------- работы ---------- */
  .works { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .work { background: var(--surface); border: 1px solid var(--rule); border-radius: 18px; overflow: hidden; }
  .work > summary {
    list-style: none; cursor: pointer; padding: 15px 16px;
    display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px;
    min-height: 44px;
  }
  .work > summary::-webkit-details-marker { display: none; }
  .work > summary:focus-visible { outline: 2px solid var(--indigo); outline-offset: -2px; }
  .w-title { font-size: 16px; font-weight: 650; letter-spacing: -.015em; line-height: 1.35; }
  .w-time {
    font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;
    background: var(--lime-soft); color: var(--ink); border-radius: 999px; padding: 4px 10px;
  }
  .w-chev { width: 13px; height: 13px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3);
            transform: rotate(45deg); margin: -4px 4px 0 0; transition: transform .18s; }
  .work[open] .w-chev { transform: rotate(-135deg); margin-top: 3px; }
  .w-body { padding: 0 16px 16px; color: var(--ink-2); font-size: 15px; line-height: 1.6; margin: 0; }
  .w-body code {
    font-family: var(--mono); font-size: 12.5px; background: var(--chip);
    border-radius: 5px; padding: 1px 5px; color: var(--ink); overflow-wrap: anywhere;
  }
  .w-empty { color: var(--ink-3); font-style: italic; }

  .total {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px;
    background: var(--lime); color: var(--on-lime); border-radius: 18px; padding: 16px 20px; margin-top: 12px;
  }
  .total .l { font-size: 16px; font-weight: 700; }
  .total .v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

  .expand {
    background: none; border: 0; font: inherit; font-size: 14px; font-weight: 600;
    color: var(--indigo); cursor: pointer; padding: 10px 0; min-height: 44px;
  }
  .expand:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }

  footer { background: var(--footer); color: #f2f2f4; margin-top: 48px; padding: 26px 0; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; }
  footer .logo { color: #f2f2f4; }
  footer p { margin: 0; font-size: 13px; color: #9a9aa2; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (min-width: 600px) {
    .wrap { padding: 0 24px; }
    h1 { font-size: 34px; }
    .ring-card { flex: 1 1 320px; }
  }
</style>

<header class="head">
  <span class="logo"><i>S</i>chedbook</span>
  <span class="tag">Отчёт о работах</span>
</header>

<div class="wrap">
  <h1>Отчёт о выполненных работах</h1>
  <p class="period" id="period"></p>

  <h2>Соглашение</h2>
  <p class="sub">Выберите соглашение, затем неделю.</p>
  <ul class="pills" id="agreements"></ul>

  <h2>План и факт</h2>
  <p class="sub" id="pf-sub"></p>
  <div class="rings"><div class="ring-card" id="pf"></div></div>

  <h2>Недели</h2>
  <p class="sub" id="weeks-sub"></p>
  <div class="week-rings" id="weeks"></div>

  <h2 id="week-title">Неделя 1</h2>
  <p class="sub" id="week-sub"></p>
  <button class="expand" id="expand" type="button">Раскрыть все</button>
  <ul class="works" id="works"></ul>
  <div class="total"><span class="l">Итого за неделю</span><span class="v" id="total">—</span></div>
</div>

<footer>
  <div class="wrap">
    <span class="logo"><i>S</i>chedbook</span>
    <p>Отчёт сформирован из журнала работ.</p>
  </div>
</footer>

<script>
const DATA = [{"id":"ДС-1","title":"Регистрация","period":"16.08 — 23.09.2025","signed":6178,"minutes":6025,"weeks":[{"n":1,"minutes":1205,"tasks":[{"title":"Стартовый экран","changes":"Инициализация проекта; Добавлены ассеты флагов, логотипы; Добавлен лаунч скрин; Добавлена локализация; Добавлены кейсы локализации; Добавлены дополнительные ассеты для флагов страны; Добавлен стиль шрифта.","minutes":250},{"title":"Регистрация по Email","changes":"Добавлены эндпоинты и модели для сетевых операций; Добавлен сетевой сервис; Сверстаны экраны входа; Подключена элементарная навигация.","minutes":130},{"title":"Регистрация через Apple","changes":"Добавлен фреймворк KeychainAccess; Добавлен сервис для хранения токенов.","minutes":160},{"title":"Форма заполнения данных","changes":"Сверстаны экраны входа и выбора страны; Добавлены компоненты дизайн системы.","minutes":200},{"title":"Форма выбора страны и телефонного кода","changes":"Добавлены ассеты флагов; Добавлено перечисление локалей и стран; Сверстаны экраны выбора страны.","minutes":123},{"title":"Авторизация по Email","changes":"Добавлены эндпоинты и модели для сетевых операций; Добавлен сетевой сервис.","minutes":114},{"title":"Архитектура и локальное хранение","changes":"Добавлен сервис кэширования сетевых запросов; Добавлен сервис хранения токена; Добавлено покрытие тестами сетевой сервис и эндпоинты.","minutes":110},{"title":"Тестирование и отладка","changes":"Добавлено покрытие тестами; Добавлено покрытие тестами сетевой сервис.","minutes":118}]},{"n":2,"minutes":1780,"tasks":[{"title":"Стартовый экран","changes":"Добавлены некоторые основные цвета приложения; Добавлены статические свойства в перечисления для локализации; Добавлены еще некоторые слова локализации; Добавлена поддержка смены локализации по всему приложению; Реализовано сохранение локализации в стандартный контейнер памяти; Локализован русский язык; Удален лишний флаг с ассетов.","minutes":330},{"title":"Регистрация по Email","changes":"Добавлен компонент ОТП; Добавлены правила валидации для ОТП; Добавлено представление подтверждения кода; Добавлена модель представления в экран входа и регистрации; Добавлено правило выключения кнопки при пустом тексте в ОТП; Добавлены новые методы и обработка ошибок в сервис авторизации; Добавлена валидация электронной почты по регулярному выражению; Добавлен модификатор ошибки в компоненты дизайн системы; Декомпозированы правила валидации по отдельным перечислениям.","minutes":345},{"title":"Регистрация через Apple","changes":"Добавлен метод получения данных из входа в Apple ID; Добавлен каркас компонента авторизации через AppleId.","minutes":150},{"title":"Форма заполнения данных","changes":"Добавлены размеры высоты для компонента с текстом ошибки; Добавлены свойства для компонента кнопки с обводкой и иконкой; Текстовые поля в компоненте с паролем объединены в один с помощью UIKit; Добавлен компонент ввода пароля; Добавлено представление списка с телефонными кодами; Внесены дополнения в компоненты дизайн системы - кнопок и строк списков.","minutes":250},{"title":"Форма выбора страны и телефонного кода","changes":"Добавлены еще некоторые ассеты и цвета приложения; Добавлен компонент текст-кнопка; Добавлены локализации для компонента сегментного пикера; Кастомный сегментный пикер адаптирован под все типы.","minutes":160},{"title":"Авторизация по Email","changes":"Добавлены новые методы и обработка ошибок в сервис авторизации; Добавлено представление забыли пароль; Декомпозированы перечисления авторизации.","minutes":140},{"title":"Архитектура и локальное хранение","changes":"Добавлен макрос получения Keychain памяти; Внедрена модель представления в зависимости среды; Добавлен сервис по локали в среду окружения; Реализован координатор для модальных окон и добавлен в среду окружения; Добавлено расширение для объединения локализованных строк.","minutes":170},{"title":"Тестирование и отладка","changes":"Добавлен координатор для авторизации и заглушка для домашней страницы; Добавлен const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// В описаниях приходят пути и имена в обратных кавычках — показываем как код.
const rich = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
function plural(n, one, few, many) {
  const t = n % 100, l = n % 10;
  return `${n} ${t >= 11 && t <= 14 ? many : l === 1 ? one : l >= 2 && l <= 4 ? few : many}`;
}

/* Кольцо: дуга от 12 часов по часовой. Плановая и фактическая дуги лежат на
   разных радиусах, поэтому перерасход виден как более длинная дуга снаружи —
   ничего не «переполняется» и не искажает масштаб. */
function ring(size, arcs, center, sub) {
  const cx = size / 2;
  const parts = arcs.map(a => {
    const r = a.r, c = 2 * Math.PI * r;
    const len = Math.max(0, Math.min(1, a.value)) * c;
    return `<circle class="ring-track" cx="${cx}" cy="${cx}" r="${r}" stroke-width="${a.w}"/>
      <circle class="${a.cls}" cx="${cx}" cy="${cx}" r="${r}" stroke-width="${a.w}"
        stroke-dasharray="${len.toFixed(2)} ${(c - len).toFixed(2)}"
        transform="rotate(-90 ${cx} ${cx})"/>`;
  }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img"
      aria-label="${esc(center)}${sub ? ", " + esc(sub) : ""}">
      ${parts}
      <text class="ring-center" x="${cx}" y="${cx - (sub ? 2 : -5)}" text-anchor="middle"
        font-size="${size * 0.2}">${esc(center)}</text>
      ${sub ? `<text x="${cx}" y="${cx + size * 0.16}" text-anchor="middle" font-size="${size * 0.11}"
        fill="currentColor" opacity=".62">${esc(sub)}</text>` : ""}
    </svg>`;
}

let current = DATA[0];
let currentWeek = current.weeks[0];

document.getElementById("agreements").innerHTML = DATA.map(a =>
  `<li><button class="pill" type="button" data-id="${a.id}" aria-pressed="false">
    ${esc(a.title)}<span class="t">${hhmm(a.minutes)}</span></button></li>`).join("");

function renderAgreement(a) {
  current = a;
  document.querySelectorAll("#agreements .pill").forEach(p =>
    p.setAttribute("aria-pressed", String(p.dataset.id === a.id)));

  document.getElementById("period").textContent =
    `${a.id} · ${a.title}. Период ${a.period}.`;

  /* --- план и факт --- */
  const max = Math.max(a.planMinutes, a.minutes) || 1;
  const dev = a.planMinutes ? Math.round((a.minutes - a.planMinutes) / a.planMinutes * 100) : 0;
  document.getElementById("pf-sub").textContent =
    `Плановые часы согласованы в соглашении, фактические приняты по акту.`;
  document.getElementById("pf").innerHTML =
    ring(132, [
      { r: 56, w: 12, value: a.minutes / max, cls: "ring-fact" },
      { r: 40, w: 12, value: a.planMinutes / max, cls: "ring-plan" }
    ], (dev > 0 ? "+" : "") + dev + "%", "к плану") +
    `<div class="ring-legend">
      <span class="leg"><span class="dot dot-fact"></span>Факт <b>${hhmm(a.minutes)}</b></span>
      <span class="leg"><span class="dot dot-plan"></span>План <b>${hhmm(a.planMinutes)}</b></span>
      <p class="ring-note">${dev > 0
        ? `Работы заняли на ${hhmm(a.minutes - a.planMinutes)} больше плана.`
        : dev < 0 ? `Уложились на ${hhmm(a.planMinutes - a.minutes)} быстрее плана.`
        : "Ровно по плану."}</p>
    </div>`;

  /* --- недели --- */
  document.getElementById("weeks-sub").textContent =
    `${plural(a.weeks.length, "неделя", "недели", "недель")}, доля каждой от ${hhmm(a.minutes)} за соглашение.`;
  document.getElementById("weeks").innerHTML = a.weeks.map(w => {
    const share = a.minutes ? w.minutes / a.minutes : 0;
    return `<button class="wr" type="button" data-n="${w.n}" aria-pressed="false">
      ${ring(76, [{ r: 30, w: 8, value: share, cls: "ring-fact" }], Math.round(share * 100) + "%")}
      <span class="wr-name">Неделя ${w.n}</span>
      <span class="wr-time">${hhmm(w.minutes)}</span></button>`;
  }).join("");

  renderWeek(a.weeks[0]);
}

function renderWeek(w) {
  currentWeek = w;
  document.querySelectorAll("#weeks .wr").forEach(b =>
    b.setAttribute("aria-pressed", String(Number(b.dataset.n) === w.n)));

  document.getElementById("week-title").textContent = `Неделя ${w.n}`;
  document.getElementById("week-sub").textContent =
    `${plural(w.tasks.length, "направление", "направления", "направлений")} работ. Нажмите, чтобы раскрыть подробности.`;

  document.getElementById("works").innerHTML = w.tasks.map(t => `<details class="work">
      <summary>
        <span class="w-title">${esc(t.title)}</span>
        <span class="w-time">${hhmm(t.minutes)}</span>
        <span class="w-chev" aria-hidden="true"></span>
      </summary>
      <p class="w-body${t.changes.trim() ? "" : " w-empty"}">${t.changes.trim()
        ? rich(t.changes) : "На этой неделе работа не велась."}</p>
    </details>`).join("");

  document.getElementById("total").textContent = hhmm(w.minutes);
  setExpandLabel();
}

function setExpandLabel() {
  const all = [...document.querySelectorAll(".work")];
  const open = all.filter(d => d.open).length;
  document.getElementById("expand").textContent = open === all.length && all.length
    ? "Свернуть все" : "Раскрыть все";
}

document.getElementById("agreements").addEventListener("click", e => {
  const p = e.target.closest(".pill");
  if (p) renderAgreement(DATA.find(a => a.id === p.dataset.id));
});
document.getElementById("weeks").addEventListener("click", e => {
  const b = e.target.closest(".wr");
  if (b) renderWeek(current.weeks.find(w => w.n === Number(b.dataset.n)));
});
document.getElementById("works").addEventListener("toggle", setExpandLabel, true);
document.getElementById("expand").addEventListener("click", () => {
  const all = [...document.querySelectorAll(".work")];
  const openAll = all.some(d => !d.open);
  all.forEach(d => { d.open = openAll; });
  setExpandLabel();
});

renderAgreement(DATA[DATA.length - 1]);
</script>
